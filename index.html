<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Every photo on the site is served from Pexels' CDN; opening the
         connection before the first <img> is discovered shaves off the
         DNS + TLS handshake that would otherwise delay it. -->
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.pexels.com" />
    <!-- This app renders entirely client-side, so the browser has no way
         to discover the homepage hero image until React mounts and inserts
         it. Preloading it here lets it start downloading immediately,
         in parallel with the JS bundle, instead of after. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://images.pexels.com/photos/8143668/pexels-photo-8143668.jpeg?auto=compress&cs=tinysrgb&w=1600"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <title>S Amerix LLC | Lawn Care & Landscape Management in Rancho Mirage, CA</title>
    <meta name="description" content="Premier lawn care and landscape management serving Rancho Mirage, Palm Desert, Palm Springs, and the Coachella Valley. Mowing, hedge pruning, cleanup, irrigation, landscape design, and full property maintenance. Free quotes." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="S Amerix LLC | Lawn Care & Landscape Management" />
    <meta property="og:description" content="Premier lawn care and landscape management serving Rancho Mirage and the Coachella Valley. Free quotes." />
    <!-- Social scrapers need an absolute URL. The github.io address keeps
         working after a custom domain is added (GitHub redirects it). -->
    <meta property="og:image" content="https://clintonkes.github.io/Amerix/assets/images/app_logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://clintonkes.github.io/Amerix/assets/images/app_logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Decodes the path public/404.html encoded before redirecting here,
      // restoring the real URL so React Router mounts on the right route.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
